<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DANH SÁCH PHÁT</title>
  <style>
    :root {
      --bg: #17122b; --bg2: #221a3d; --card: #1e1738; --border: #362b57;
      --ink: #f3f0ff; --ink2: #c9c1e6; --ink3: #8f86b3; --pink: #fe2c55; --amber: #ff9a3d;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      background: var(--bg); color: var(--ink);
      font-family: "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
      display: flex; flex-direction: column;
    }
    /* Tổng số beat trong danh sách: icon nốt nhạc TRẮNG (ký tự ♫ để ăn màu) + số tổng. */
    .tb-count { display: inline-flex; align-items: center; gap: 7px; color: #fff; font-size: 18px; font-weight: 800; }
    .tb-count .tb-note { font-size: 20px; line-height: 1; }
    /* Thanh điều khiển: chỉ icon, không nền, cỡ lớn hơn + giãn cách an toàn để tránh bấm nhầm. */
    .toolbar { display: flex; align-items: center; gap: 18px; padding: 10px 18px; border-bottom: 1px solid var(--border); background: var(--bg2); flex-wrap: wrap; }
    .toolbar button { display: inline-flex; align-items: center; justify-content: center; cursor: pointer; border: none; background: transparent; color: var(--ink); font-size: 23px; line-height: 1; width: 42px; height: 42px; border-radius: 12px; }
    .toolbar button:hover { background: rgba(255,255,255,.10); }
    .toolbar button:disabled { opacity: .35; cursor: default; background: transparent; }
    .toolbar .tb-danger { color: var(--pink); }
    .toolbar .tb-danger:hover { background: rgba(254,44,85,.18); }
    .toolbar .tb-spacer { flex: 1; }
    .toolbar #tbPause.is-paused { color: var(--amber); }
    main { flex: 1; overflow-y: auto; padding: 14px 16px 24px; }
    main::-webkit-scrollbar { width: 8px; }
    main::-webkit-scrollbar-thumb { background: #4a3d70; border-radius: 999px; }
    main::-webkit-scrollbar-thumb:hover { background: #5d4d8a; }
    main::-webkit-scrollbar-track { background: transparent; }
    .now-label { font-size: 11.5px; font-weight: 800; letter-spacing: 1px; color: var(--pink); text-transform: uppercase; margin: 0 0 7px; }
    .queue-label { font-size: 11.5px; font-weight: 800; letter-spacing: 1px; color: var(--ink3); text-transform: uppercase; margin: 18px 0 7px; }
    .item {
      display: flex; align-items: center; gap: 11px;
      padding: 9px 13px; margin-bottom: 8px;
      background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    }
    .item.live { background: rgba(254,44,85,.12); border-color: var(--pink); border-width: 2px; }
    body.paused .item.live { opacity: .6; filter: saturate(.5); }
    .item .num { min-width: 22px; text-align: center; font-weight: 800; color: var(--ink3); font-size: 14px; }
    .item.live .num { color: var(--pink); }
    .item img { width: 34px; height: 34px; object-fit: contain; border-radius: 8px; flex: none; }
    .item .name { flex: none; font-weight: 800; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 55%; }
    .item .file { flex: 1 1 auto; min-width: 0; color: var(--ink2); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .item .ov { font-size: 11px; font-weight: 700; color: var(--amber); background: rgba(255,154,61,.14); padding: 2px 8px; border-radius: 999px; flex: none; }
    .item .live-tag { font-style: normal; font-weight: 800; font-size: 11.5px; color: var(--pink); flex: none; }
    /* Nút xóa: LUÔN nằm cuối hàng (mid co giãn đẩy nó sang phải) → mọi ✕ thẳng 1 cột. */
    .item .del { flex: none; margin-left: 10px; width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--border); background: transparent; color: var(--ink3); font-size: 15px; font-weight: 800; cursor: pointer; line-height: 1; }
    .item .del:hover { border-color: var(--pink); color: #fff; background: rgba(254,44,85,.2); }
    .idle { padding: 22px; text-align: center; color: var(--ink3); font-size: 13px; }
    .more { color: var(--ink3); font-size: 12.5px; padding: 6px 2px; }
    /* Tên + tên file trên CÙNG 1 hàng (giãn cách an toàn), mid co giãn đẩy nút ✕ sang mép phải. */
    .item .mid { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: row; align-items: baseline; gap: 14px; overflow: hidden; }
  </style>
</head>
<body>
  <div class="toolbar">
    <button id="tbPause" type="button" title="Tạm dừng / tiếp tục mục đang phát">⏸</button>
    <button id="tbSkip" type="button" title="Bỏ mục đang phát, sang mục kế tiếp">⏭</button>
    <button id="tbShuffle" type="button" title="Xáo trộn ngẫu nhiên hàng chờ">🎲</button>
    <span class="tb-spacer"></span>
    <span class="tb-count" title="Tổng số beat trong danh sách phát"><span class="tb-note">♫</span><b id="tbTotal">0</b></span>
    <button id="tbClearAll" class="tb-danger" type="button" title="Ngưng &amp; xóa toàn bộ danh sách phát">🗑</button>
  </div>
  <main id="body">
    <div class="idle">Đang chờ dữ liệu từ HP GROUP LIVE…</div>
  </main>
  <script src="playlist-window.js"></script>
</body>
</html>
